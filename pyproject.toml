[project]
name = "pythonman-42"
version = "0.1.0"
description = "Pac-Man game for the 42 curriculum"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce",
    "mazegenerator",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-00001/mazegenerator-2.1.0-py3-none-any.whl" }

[tool.mypy]
python_version = "3.10"
files = ["shell", "engine", "pac-man.py"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true